            let button = document.querySelector("button")

            button.addEventListener("click", getBPM);

            let clicks = [];

            function getBPM() {
            const timeRightNow = Date.now();
            clicks.push(timeRightNow);
            
            if(clicks.length >= 10) {
                let totalInterval = 0;

                for (let i = 1; < clicks.length; i++) {
                        totalInterval += clicks[i] - click[i-1];

                }
                const averageInterval = totalInterval / (clicks.length - 1);
                const bpm = Math.round(convert(averageInterval));
                alert("The BPM is: " + bpm); 
                clicks = [];
                console.log("Total Interval" + totalInterval);
                } else {
                    console.log("There's not enough clicks yet to calculate.")
                }

            }

            // Takes in averageInterval and converts to BPM
            function convert(time) {
                return 60 / (time / 1000);
            }
