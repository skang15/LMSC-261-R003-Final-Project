<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>

        </style>
    </head>
    <body>
        <h1>Drumset</h1>

        <img id="cowbell" src="assets/images.jpeg" alt="grey cowbell with drumstick" />
        <img id="snare" src="assets/snare.jpeg" alt="silver snare drum" />


        <script>

            // let cowbell = document.querySelector("img");
            cowbell.addEventListener("click", playCowbell);
            snare.addEventListener("click", playSnare)

            function playCowbell() {
                let cowbellSound = new Audio("assets/cowbellSound.mp3");
                cowbellSound.play();
            }

            function playSnare() {
                let snareSound = new Audio("assets/snareSound.mp3");
                snareSound.play();
            }


        </script>
    </body>
</html>
